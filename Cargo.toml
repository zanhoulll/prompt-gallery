[package]
name = "prompt-gallery"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Prompt Gallery — 本地提示词图库：一张图片 + 正向/负向提示词"
authors = ["Prompt Gallery contributors"]
license = "MIT"

[dependencies]
# GUI：即时模式渲染，低资源占用，完全控制绘制（ADR-0001）
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["image"] }

# 数据库：元数据与正/负向提示词（ADR-0003、ADR-0011）
rusqlite = { version = "0.40", features = ["bundled"] }

# 图片解码 / 缩略图
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }

# 内容哈希：图片以哈希命名、天然去重（ADR-0003）
blake3 = "1.8"

# 导出 / 导入：JSON + 图片打包成 zip
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

# 原生文件对话框
rfd = "0.17"

anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
